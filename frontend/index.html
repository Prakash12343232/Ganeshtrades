    <script>
      (function() {
        try {
          var root = document.documentElement;
          var saved = localStorage.getItem('ganesh-theme');
          var legacy = localStorage.getItem('theme');
          var theme = ['fresh', 'royal', 'midnight', 'warm'].indexOf(saved) >= 0
            ? saved
            : (legacy === 'light' ? 'fresh' : 'midnight');
          root.dataset.theme = theme;
          root.classList.add(theme === 'midnight' ? 'dark' : 'light', 'theme-' + theme);
          root.style.colorScheme = theme === 'midnight' ? 'dark' : 'light';
          document.querySelector('meta[name="theme-color"]').content = {
            fresh: '#F7FAF5', royal: '#F8F7FF', midnight: '#0B1020', warm: '#FFF8EC'
          }[theme];
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
    <title>Ganesh Trades</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
