<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%" fill="none">
  <defs>
    <filter id="mint-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&amp;display=swap');
      .cursive-text {
        font-family: 'Caveat', 'Brush Script MT', cursive, sans-serif;
        font-size: 34px;
        font-weight: 700;
        fill: #e2e8f0;
        letter-spacing: 0.5px;
      }
    </style>
  </defs>

  <!-- Background subtle glow -->
  <circle cx="160" cy="120" r="90" fill="#34d399" opacity="0.06" filter="url(#mint-glow)" />

  <!-- LEAVES AND VEGETABLES INSIDE BASKET -->
  
  <!-- Left Leaf Group -->
  <path d="M 125 55 C 105 20, 115 5, 120 2 C 130 25, 135 45, 125 55 Z" fill="#34d399" stroke="#34d399" stroke-width="2" stroke-linejoin="round"/>
  <path d="M 120 2 C 140 15, 145 35, 132 58 C 130 40, 125 20, 120 2 Z" fill="#10b981" stroke="#34d399" stroke-width="1.5"/>
  <path d="M 122 15 Q 126 35 128 52" stroke="#042f2e" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Center Top Sprout / Carrot Tops -->
  <path d="M 160 50 C 150 25, 155 10, 160 8 C 168 22, 168 38, 160 50 Z" fill="#34d399" stroke="#34d399" stroke-width="2"/>
  <path d="M 160 8 C 175 20, 175 38, 165 52 C 164 38, 162 20, 160 8 Z" fill="#10b981" stroke="#34d399" stroke-width="1.5"/>

  <!-- Carrot (Orange/Yellow) -->
  <path d="M 148 52 Q 155 42 165 48 L 158 85 Q 152 82 148 52 Z" fill="#fb923c" stroke="#34d399" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M 150 58 Q 158 60 156 64" stroke="#f97316" stroke-width="2" stroke-linecap="round"/>
  <path d="M 152 70 Q 157 71 155 74" stroke="#f97316" stroke-width="2" stroke-linecap="round"/>

  <!-- Tomato / Red Bell Pepper (Red/Orange) -->
  <path d="M 172 45 C 160 45, 158 65, 170 75 C 185 80, 198 68, 192 52 C 188 45, 178 43, 172 45 Z" fill="#f87171" stroke="#34d399" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M 175 44 C 172 38, 178 35, 180 37" stroke="#34d399" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M 178 37 L 176 43" stroke="#34d399" stroke-width="2" stroke-linecap="round"/>
  <circle cx="182" cy="54" r="2.5" fill="#fef08a" opacity="0.8"/>

  <!-- Yellow Squash / Lemon / Pepper -->
  <path d="M 130 58 C 120 62, 122 80, 138 82 C 148 82, 152 70, 142 60 Z" fill="#facc15" stroke="#34d399" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Right Leaf Group -->
  <path d="M 195 55 C 215 25, 230 35, 222 45 C 208 52, 200 58, 195 55 Z" fill="#34d399" stroke="#34d399" stroke-width="2"/>
  <path d="M 222 45 C 235 55, 220 70, 198 62 C 205 58, 215 52, 222 45 Z" fill="#10b981" stroke="#34d399" stroke-width="1.5"/>

  <!-- BASKET FRAME (MINT GREEN WIREFRAME) -->
  
  <!-- Basket Top Rim -->
  <rect x="85" y="75" width="150" height="14" rx="7" fill="#064e3b" stroke="#34d399" stroke-width="3"/>
  <line x1="88" y1="82" x2="232" y2="82" stroke="#34d399" stroke-width="1.5" opacity="0.6"/>

  <!-- Basket Handles -->
  <path d="M 105 75 C 105 45, 215 45, 215 75" fill="none" stroke="#34d399" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M 115 75 C 115 52, 205 52, 205 75" fill="none" stroke="#34d399" stroke-width="2" stroke-dasharray="4 3" opacity="0.7"/>

  <!-- Basket Body Grid Structure -->
  <path d="M 92 89 L 108 165 C 110 174, 118 180, 128 180 L 192 180 C 202 180, 210 174, 212 165 L 228 89 Z" fill="#042f2e" fill-opacity="0.4" stroke="#34d399" stroke-width="3" stroke-linejoin="round"/>

  <!-- Basket Vertical Wire Ribs -->
  <path d="M 112 89 L 124 180" stroke="#34d399" stroke-width="2.5"/>
  <path d="M 136 89 L 144 180" stroke="#34d399" stroke-width="2.5"/>
  <path d="M 160 89 L 160 180" stroke="#34d399" stroke-width="2.5"/>
  <path d="M 184 89 L 176 180" stroke="#34d399" stroke-width="2.5"/>
  <path d="M 208 89 L 196 180" stroke="#34d399" stroke-width="2.5"/>

  <!-- Basket Horizontal Wire Rungs -->
  <path d="M 96 112 Q 160 118 224 112" stroke="#34d399" stroke-width="2.5" fill="none"/>
  <path d="M 102 135 Q 160 142 218 135" stroke="#34d399" stroke-width="2.5" fill="none"/>
  <path d="M 106 158 Q 160 164 214 158" stroke="#34d399" stroke-width="2.5" fill="none"/>

  <!-- Items visible through basket mesh grid -->
  <circle cx="138" cy="135" r="9" fill="#fb923c" opacity="0.9"/>
  <circle cx="160" cy="142" r="10" fill="#f87171" opacity="0.9"/>
  <circle cx="180" cy="132" r="8" fill="#facc15" opacity="0.9"/>

  <!-- HANDWRITTEN SCRIPT TEXT: "Groceries Made Simple" -->
  <text x="160" y="235" text-anchor="middle" class="cursive-text">Groceries</text>
  <text x="160" y="272" text-anchor="middle" class="cursive-text">Made Simple</text>
</svg>
