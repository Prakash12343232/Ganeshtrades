services:
  - type: web
    name: ganeshtrades1
    runtime: node
    repo: https://github.com/Prakash12343232/Ganeshtrades.git
    branch: main
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: true
    healthCheckPath: /api/health
    buildFilter:
      paths:
        - backend/**
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: FRONTEND_URL
        value: https://ganeshtrades.vercel.app,https://ganeshtrades1.onrender.com
      - key: JWT_EXPIRE
        value: 7d
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false