services:
  - type: web
    name: ganesh-trades
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    buildFilter:
      paths:
        - backend/**
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: FRONTEND_URL
        value: https://ganeshtrades.onrender.com
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false