name: Ganesh Trades CI

on:
  push:
    branches: [main, 'repair/**']
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      JWT_SECRET: ci-test-secret-minimum-32-characters-long
      JWT_EXPIRE: 7d

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # npm lockfiles generated on Windows can omit sharp's Linux optional
      # native packages. Install the exact Linux x64 runtime without modifying
      # the workspace lockfile so sharp is available for backend tests.
      - name: Install sharp Linux runtime
        run: >-
          npm install --no-save --package-lock=false --ignore-scripts
          --os=linux --cpu=x64
          @img/sharp-linux-x64@0.35.5
          @img/sharp-libvips-linux-x64@1.3.4

      - name: Verify sharp native runtime
        run: node -e "require('sharp'); console.log('sharp native runtime loaded')"

      # ── Backend Validation ──

      - name: Validate backend syntax
        working-directory: ./backend
        run: node --check server.js

      - name: Run backend tests
        working-directory: ./backend
        run: npm test

      # ── OTP Server Validation ──

      - name: Validate OTP server syntax
        working-directory: ./otp-server
        run: node --check server.js

      - name: Run OTP server tests
        working-directory: ./otp-server
        run: npm test

      # ── Frontend Validation ──

      - name: Lint frontend
        working-directory: ./frontend
        continue-on-error: true
        run: npm run lint

      - name: Test frontend
        working-directory: ./frontend
        run: npm test

      - name: Build frontend
        working-directory: ./frontend
        env:
          VITE_API_URL: https://ganeshtrades1.onrender.com/api
        run: npm run build
